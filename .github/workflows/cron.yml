name: Call Next.js Cron API

on:
  # 1️⃣ Deploy / push hote hi chalega
  push:
    branches:
      - main

  # 2️⃣ हर 1 मिनट में चलेगा
  schedule:
    - cron: "* * * * *"

  # 3️⃣ Manually GitHub se run kar sakega
  workflow_dispatch:

jobs:
  call-cron-api:
    runs-on: ubuntu-latest

    steps:
      - name: Call Next.js cron API
        run: |
          echo "Calling Next.js cron API..."
          curl -X POST https://pharmato-nextjs.vercel.app/api/cron
