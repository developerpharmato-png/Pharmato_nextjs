name: Call Next.js Cron API

on:
  # 2️⃣ हर 1 मिनट में चलेगा
  schedule:
    - cron: "*/30 * * * *"

  # 3️⃣ Manually GitHub se run kar sakega
  workflow_dispatch:

jobs:
  call-cron-api:
    runs-on: ubuntu-latest

    steps:
      - name: Call Next.js cron API
        run: |
          echo "Calling Next.js cron API..."
          curl -X POST https://dev.api.pharmatoindia.com/api/admin/marg/cron
